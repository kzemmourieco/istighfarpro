<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الورد اليومي - 5250</title>
    <style>
        /* CSS: نفس التصميم تاعك */
        body {
            background-color: #0d2a23;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .header { width: 100%; text-align: right; margin-bottom: 20px; }
        .header h1 { color: #e5b85c; font-size: 24px; margin: 0; }
        .header p { color: #a0b0a8; font-size: 14px; margin: 5px 0; }

        /* الدائرة الكبيرة */
        .circle-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 20px 0;
        }
        .circle-bg {
            fill: none;
            stroke: #1e443a;
            stroke-width: 12;
        }
        .circle-progress {
            fill: none;
            stroke: #e5b85c;
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 691;
            stroke-dashoffset: 691;
            transition: stroke-dashoffset 0.3s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        .circle-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
        }
        .circle-number { font-size: 48px; font-weight: bold; margin: 0; }
        .circle-percent { font-size: 18px; color: #e5b85c; margin: 0; }

        /* الزر الأصفر الذكي اللي فيه الذكر */
        .current-dhikr {
            background-color: #e5b85c;
            color: #0d2a23;
            padding: 20px 30px;
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0;
            text-align: center;
            width: 100%;
            max-width: 350px;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
            line-height: 1.5;
        }
        .current-dhikr:active { transform: scale(0.95); }

        /* الأزرار السفلية */
        .controls {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 350px;
        }
        .btn {
            flex: 1;
            background-color: transparent;
            border: 1px solid #4a6b60;
            color: #fff;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #1e443a; }
        .btn-primary { background-color: #1e443a; border: none; }
        
        .footer-info {
            margin-top: 20px;
            background-color: #14382f;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            max-width: 350px;
            text-align: right;
            font-size: 14px;
            color: #a0b0a8;
            display: flex;
            justify-content: space-between;
            box-sizing: border-box;
        }
        
        .total-progress {
            margin-top: 15px;
            font-size: 14px;
            color: #e5b85c;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>الورد اليومي</h1>
        <p id="phase-title">المرحلة 1 من 6</p>
    </div>

    <div class="circle-container">
        <svg class="progress-ring" width="250" height="250">
            <circle class="circle-bg" cx="125" cy="125" r="110"></circle>
            <circle class="circle-progress" id="progress-ring" cx="125" cy="125" r="110"></circle>
        </svg>
        <div class="circle-text">
            <p class="circle-number" id="count-text">0</p>
            <p class="circle-percent" id="percent-text">0%</p>
        </div>
    </div>

    <!-- الزر الأصفر الذكي -->
    <div class="current-dhikr" id="dhikr-btn" onclick="increment()">
        <span id="dhikr-name">اضغط للبدء</span>
    </div>

    <div class="controls">
        <button class="btn" onclick="undo()">تراجع</button>
        <button class="btn btn-primary" onclick="add100()">أضف 100</button>
    </div>

    <div class="footer-info">
        <span>باقي في الذكر: <b id="remaining-text">0</b></span>
        <span>هدف الذكر: <b id="target-text">0</b></span>
    </div>

    <div class="total-progress">
        إجمالي ما تم إنجازه اليوم: <b id="total-done">0</b> / 5250
    </div>

    <script>
        // 1. الأذكار بالترتيب الصحيح (المجموع 5250)
        const phases = [
            { name: "الحمد لله", target: 300 },
            { name: "سبحان الله", target: 300 }, // ✅ تصحيح: ولات سبحان الله
            { name: "الله أكبر", target: 300 },
            { name: "صلى الله عليه وسلم", target: 300 },
            { name: "رضيت بالله ربا وبالإسلام دينا وبمحمد نبيا", target: 50 },
            { name: "أستغفر الله", target: 4000 }
        ];

        let currentPhaseIndex = 0; 
        let currentCount = 0; 
        let totalDone = 0; 

        // عناصر HTML
        const dhikrNameEl = document.getElementById('dhikr-name');
        const countTextEl = document.getElementById('count-text');
        const percentTextEl = document.getElementById('percent-text');
        const remainingEl = document.getElementById('remaining-text');
        const targetEl = document.getElementById('target-text');
        const progressRingEl = document.getElementById('progress-ring');
        const phaseTitleEl = document.getElementById('phase-title');
        const totalDoneEl = document.getElementById('total-done');

        const circumference = 2 * Math.PI * 110; 

        // دالة تحديث الواجهة
        function updateUI() {
            if (currentPhaseIndex >= phases.length) {
                dhikrNameEl.innerText = "ماشاء الله! أكملت الورد كامل 🎉";
                countTextEl.innerText = "🎉";
                percentTextEl.innerText = "100%";
                progressRingEl.style.strokeDashoffset = 0;
                phaseTitleEl.innerText = "تم الورد اليومي";
                totalDoneEl.innerText = "5250";
                return;
            }

            const phase = phases[currentPhaseIndex];
            
            dhikrNameEl.innerText = `${phase.name} (${currentCount} / ${phase.target})`;
            countTextEl.innerText = currentCount;
            
            const percent = (currentCount / phase.target) * 100;
            percentTextEl.innerText = `${Math.round(percent)}%`;
            
            const offset = circumference - (percent / 100) * circumference;
            progressRingEl.style.strokeDashoffset = offset;

            targetEl.innerText = phase.target;
            remainingEl.innerText = phase.target - currentCount;
            totalDoneEl.innerText = totalDone;

            phaseTitleEl.innerText = `المرحلة ${currentPhaseIndex + 1} من ${phases.length}`;
        }

        // دالة الزيادة (كي تكليكي على الزر الأصفر)
        function increment() {
            if (currentPhaseIndex >= phases.length) return; 

            const phase = phases[currentPhaseIndex];
            currentCount++;
            totalDone++;

            // إذا كملنا الذكر الحالي -> ننتقلوا للذكر اللي بعده أوتوماتيكياً
            if (currentCount >= phase.target) {
                currentPhaseIndex++;
                currentCount = 0;
            }

            updateUI();
        }

        // دالة التراجع
        function undo() {
            if (currentPhaseIndex >= phases.length) {
                currentPhaseIndex = phases.length - 1;
                currentCount = phases[currentPhaseIndex].target - 1;
                totalDone = 5250 - 1;
            } else if (currentCount > 0) {
                currentCount--;
                totalDone--;
            } else if (currentPhaseIndex > 0) {
                currentPhaseIndex--;
                currentCount = phases[currentPhaseIndex].target - 1;
                totalDone--;
            }
            updateUI();
        }

        // دالة إضافة 100
        function add100() {
            if (currentPhaseIndex >= phases.length) return;
            
            const phase = phases[currentPhaseIndex];
            let needed = Math.min(100, phase.target - currentCount);
            
            currentCount += needed;
            totalDone += needed;

            if (currentCount >= phase.target) {
                currentPhaseIndex++;
                currentCount = 0;
            }
            updateUI();
        }

        // التهيئة الأولى
        updateUI();
    </script>
</body>
  </html>
